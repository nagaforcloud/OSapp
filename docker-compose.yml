# docker-compose.yml
version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: onestream-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  redis:
    image: redis:7-alpine
    container_name: onestream-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'

  llm-service:
    build:
      context: ./services/inference_api
      dockerfile: Dockerfile.inference
    container_name: onestream-llm-service
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models  # Shared models directory
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=INFO
      - LOCAL_LLM_MODEL_PATH=/app/models/mistral-7b-instruct-v0.2.Q4_K_M.gguf
      - LOCAL_MODEL_N_CTX=4096
      - LOCAL_MODEL_N_GPU_LAYERS=0
      - DEFAULT_MAX_TOKENS=2048
      - DEFAULT_TEMPERATURE=0.7
      - MODEL_THREADS=4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G  # Dedicated memory for LLM inference
          cpus: '2.0'  # Dedicated CPU cores
        reservations:
          memory: 6G
          cpus: '1.5'

  rag-app:
    build: .
    container_name: onestream-rag-app
    ports:
      - "8501:8501"  # Streamlit UI
      - "5000:5000"  # Flask API (if needed)
    volumes:
      - shared_docs:/app/data  # Shared documents volume
      - ./logs:/app/logs
      - ./downloaded_pdfs_from_search:/app/downloaded_pdfs_from_search
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONPATH=/app
      - LOG_LEVEL=INFO
      # Use external LLM service instead of local
      - LLM_SERVICE_URL=http://llm-service:8000
      - USE_LOCAL_LLM=false  # Disable local LLM loading in main app
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G  # Reduced from 2GB to 2GB
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  nginx:
    image: nginx:alpine
    container_name: onestream-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - rag-app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'

volumes:
  qdrant_data:
    driver: local
  redis_data:
    driver: local
  shared_docs:
    driver: local  # Shared documents volume for both services

networks:
  default:
    name: onestream-network
    driver: bridge